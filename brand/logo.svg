    <rect x="40" y="140" width="20" height="40" fill="#69CF8D"/>
    <!-- handle -->
    <rect x="100" y="220" width="40" height="20" fill="#2F7A54"/>
    <rect x="100" y="240" width="40" height="20" fill="#2F7A54"/>
    <!-- sound rays -->
    <rect x="240" y="140" width="20" height="40" fill="#69CF8D"/>
    <rect x="240" y="80" width="20" height="20" fill="#46B87D"/>
    <rect x="260" y="60" width="20" height="20" fill="#69CF8D"/>
    <rect x="240" y="220" width="20" height="20" fill="#46B87D"/>
    <rect x="260" y="240" width="20" height="20" fill="#69CF8D"/>
  </g>
</svg>
